# ==============================================================================
# Mutations dla Firebase Data Connect (Projekt PCMaker)
# ==============================================================================

# Tworzenie nowego użytkownika
mutation CreateUser(
  $firstName: String!
  $lastName: String!
  $email: String!
  $password: String!
  $phone: String
) @auth(level: PUBLIC, insecureReason: "Public registration operation.") {
  user_insert(
    data: {
      firstName: $firstName
      lastName: $lastName
      email: $email
      password: $password
      phone: $phone
      # Rola nie pochodzi z danych przesłanych przez klienta. Rejestracja
      # zawsze tworzy konto CLIENT; nadanie ADMIN wymaga osobnej operacji
      # administracyjnej wykonywanej po stronie serwera.
      role: CLIENT
    }
  )
}

# Utworzenie nowego zgłoszenia serwisowego.
# Przekazany clientId nie może być podstawą autoryzacji, dlatego operacja jest
# zablokowana dla SDK klienta do czasu migracji na auth.uid.
mutation CreateServiceTicket(
  $ticketNumber: String!
  $clientId: UUID!
  $serviceTypeId: UUID!
  $title: String!
  $description: String!
  $deviceName: String
  $deviceSerialNumber: String
  $priority: TicketPriority = NORMAL
) @auth(level: NO_ACCESS) {
  serviceTicket_insert(
    data: {
      ticketNumber: $ticketNumber
      clientId: $clientId
      serviceTypeId: $serviceTypeId
      title: $title
      description: $description
      deviceName: $deviceName
      deviceSerialNumber: $deviceSerialNumber
      priority: $priority
    }
  )
}

# Dodanie komentarza do zgłoszenia serwisowego. Wymaga sprawdzenia autora i
# dostępu do zgłoszenia; authorId oraz isInternal nie mogą być danymi klienta.
mutation AddTicketComment(
  $ticketId: UUID!
  $authorId: UUID!
  $content: String!
  $isInternal: Boolean = false
) @auth(level: NO_ACCESS) {
  ticketComment_insert(
    data: {
      ticketId: $ticketId
      authorId: $authorId
      content: $content
      isInternal: $isInternal
    }
  )
}

# Zapis nowej konfiguracji PC. Wymaga powiązania właściciela z auth.uid.
mutation CreatePcConfiguration(
  $userId: UUID!
  $name: String!
  $description: String
  $totalPrice: Float = 0.0
  $estimatedPerformance: Float
  $isPublic: Boolean = false
) @auth(level: NO_ACCESS) {
  pcConfiguration_insert(
    data: {
      userId: $userId
      name: $name
      description: $description
      totalPrice: $totalPrice
      estimatedPerformance: $estimatedPerformance
      isPublic: $isPublic
    }
  )
}

# Dodanie wybranego komponentu do zestawu PC. Operacja musi najpierw
# sprawdzać, czy konfiguracja należy do zalogowanego użytkownika.
mutation AddConfigurationComponent(
  $configurationId: UUID!
  $componentId: UUID!
  $quantity: Int = 1
  $priceAtSelection: Float!
  $isSelected: Boolean = true
) @auth(level: NO_ACCESS) {
  configurationComponent_insert(
    data: {
      configurationId: $configurationId
      componentId: $componentId
      quantity: $quantity
      priceAtSelection: $priceAtSelection
      isSelected: $isSelected
    }
  )
}
