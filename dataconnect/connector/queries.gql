# ==============================================================================
# Queries dla Firebase Data Connect (Projekt PCMaker)
# ==============================================================================

# Pobranie listy komponentów (opcjonalnie filtrowane po typie)
query ListComponents($type: String) @auth(level: PUBLIC, insecureReason: "Publicly accessible components directory.") {
  components(
    where: { componentType: { eq: $type } }
    orderBy: [{ name: ASC }]
  ) {
    id
    name
    manufacturer
    model
    componentType
    description
    price
    performanceScore
    productUrl
  }
}

# Pobranie pojedynczego komponentu ze specyfikacjami
query GetComponentById($id: UUID!) @auth(level: PUBLIC, insecureReason: "Publicly accessible component details.") {
  component(id: $id) {
    id
    name
    manufacturer
    model
    componentType
    description
    price
    performanceScore
    productUrl
  }
}

# Pobranie listy dostępnych typów usług serwisowych
query ListServiceTypes @auth(level: PUBLIC, insecureReason: "Publicly accessible service types.") {
  serviceTypes(where: { isActive: { eq: true } }) {
    id
    name
    description
    basePrice
    completionDate
  }
}

# Pobranie zgłoszeń serwisowych.
#
# Ta operacja pozostaje w kontrakcie, lecz nie może być wywoływana przez SDK
# klienta. Zawiera opisy usterek, numery seryjne oraz koszty wszystkich osób.
# Udostępnij ją dopiero po dodaniu kontroli właściciela opartej o auth.uid.
query ListServiceTickets @auth(level: NO_ACCESS) {
  serviceTickets(orderBy: [{ createdAt: DESC }]) {
    id
    ticketNumber
    title
    description
    deviceName
    deviceSerialNumber
    priority
    status
    estimatedCost
    finalCost
    createdAt
  }
}

# Pobranie szczegółów pojedynczego zgłoszenia z komentarzami i historią.
# Wymaga kontroli właściciela/roli przed udostępnieniem klientowi.
query GetServiceTicketById($id: UUID!) @auth(level: NO_ACCESS) {
  serviceTicket(id: $id) {
    id
    ticketNumber
    title
    description
    deviceName
    deviceSerialNumber
    priority
    status
    estimatedCost
    finalCost
    createdAt
    updatedAt
    completedAt
  }
}

# Pobranie publicznych konfiguracji PC
query ListPublicConfigurations @auth(level: PUBLIC, insecureReason: "Publicly accessible PC configurations.") {
  pcConfigurations(where: { isPublic: { eq: true } }, orderBy: [{ createdAt: DESC }]) {
    id
    name
    description
    totalPrice
    estimatedPerformance
    createdAt
  }
}

# Wyszukanie użytkownika po e-mailu.
# Nie wolno wystawiać tej operacji klientowi: zwraca hash hasła i umożliwia
# enumerację adresów e-mail. Logowanie realizuje endpoint aplikacji.
query GetUserByEmail($email: String!) @auth(level: NO_ACCESS) {
  users(where: { email: { eq: $email } }, limit: 1) {
    id
    firstName
    lastName
    email
    password   
    role
    isActive
  }
}
